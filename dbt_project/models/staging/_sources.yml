version: 2

sources:
  - name: raw
    description: "Raw Parquet archive in MinIO, written by the Airflow extraction DAG (raw_extract_requests)."
    meta:
      external_location: "s3://data-lake/raw/requests/*/*/*/*.parquet"
    tables:
      - name: requests
        description: "Immutable as-is copy of the requests table from KuFlow, partitioned by year/month/day."
